<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 520px; padding: 16px; font-family: sans-serif; background: #111; color: #eee; }
      h3 { margin: 0 0 12px; color: #f0b90b; }
      .warning-box {
        background: #1a1200;
        border: 1px solid #f0b90b;
        border-left: 4px solid #e53935;
        border-radius: 4px;
        padding: 8px 10px;
        margin-bottom: 12px;
        font-size: 12px;
        color: #bba060;
        line-height: 1.5;
      }
      .warning-box strong { color: #e53935; }
      .row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
      label { font-size: 12px; color: #888; white-space: nowrap; }
      select {
        flex: 1;
        padding: 7px 10px;
        background: #222;
        border: 1px solid #444;
        border-radius: 4px;
        color: #eee;
        font-size: 13px;
        cursor: pointer;
      }
      select:focus { outline: none; border-color: #f0b90b; }
      input {
        flex: 1;
        padding: 7px 10px;
        background: #222;
        border: 1px solid #444;
        border-radius: 4px;
        color: #eee;
        font-size: 13px;
      }
      input:focus { outline: none; border-color: #f0b90b; }
      input::placeholder { color: #555; }
      #customRow { display: none; margin-bottom: 10px; }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
      }
      #listenBtn { background: #f0b90b; color: #111; }
      #listenBtn:hover { background: #d4a409; }
      #listenBtn.listening { background: #e53935; color: #fff; }
      #listenBtn.listening:hover { background: #c62828; }
      #copyBtn { background: #2e7d32; color: white; margin-top: 8px; }
      #copyBtn:hover { background: #1b5e20; }
      #curlOutput {
        width: 100%;
        height: 120px;
        font-size: 11px;
        font-family: monospace;
        border: 1px solid #333;
        border-radius: 4px;
        padding: 8px;
        box-sizing: border-box;
        resize: vertical;
        background: #1a1a1a;
        color: #ccc;
        margin-top: 10px;
      }
      #status { margin-top: 10px; font-size: 13px; min-height: 18px; color: #aaa; }
      .success { color: #66bb6a; }
      .error { color: #ef5350; }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
      .pulse { color: #f0b90b; animation: pulse 1s infinite; }
      .steps {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 10px 12px;
        margin-bottom: 12px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: #bbb;
        padding: 4px 0;
      }
      .step + .step { border-top: 1px solid #222; }
      #toast {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0;
        background: #c62828;
        color: #fff;
        font-size: 13px;
        font-weight: bold;
        text-align: center;
        padding: 10px 16px;
        z-index: 999;
        animation: slideDown .2s ease;
      }
      @keyframes slideDown { from { transform: translateY(-100%) } to { transform: translateY(0) } }
      .num {
        width: 18px;
        height: 18px;
        background: #f0b90b;
        color: #111;
        border-radius: 50%;
        font-size: 11px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div id="toast"></div>
    <h3>🔑 币安Alpha信息获取</h3>
    <div class="warning-box">
      ⚠️ <strong>安全警告：</strong>生成的 curl 包含登录凭证，<strong>请勿向任何人泄露</strong>，否则他人可直接操作你的账户，造成财产损失。
    </div>

    <div class="steps">
      <div class="step"><span class="num">1</span>输入接口关键词，点「开始监听」</div>
      <div class="step"><span class="num">2</span>关掉此窗口，切到币安页面正常操作</div>
      <div class="step"><span class="num">3</span>图标变 <strong style="color:#4caf50">✓</strong> 表示捕获成功</div>
      <div class="step"><span class="num">4</span>重新点开插件，复制 curl 命令即可</div>
    </div>

    <div class="row">
      <label>接口关键词</label>
      <select id="urlPreset">
        <option value="get-wallet-asset">余额接口</option>
        <option value="alpha-trade/order/place">下单接口</option>
        <option value="__custom__">其他（手动输入）</option>
      </select>
    </div>

    <div class="row" id="customRow">
      <label>关键词</label>
      <input id="urlKeyword" placeholder="输入接口关键词，如 wallet/asset" />
    </div>

    <button id="listenBtn">开始监听</button>
    <textarea id="curlOutput" readonly placeholder="点击「开始监听」后，在币安页面触发对应请求，curl 自动生成..."></textarea>
    <button id="copyBtn">复制 curl 命令</button>
    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
