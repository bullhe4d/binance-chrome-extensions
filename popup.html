<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 520px;
        padding: 16px;
        font-family: sans-serif;
      }
      h3 {
        margin: 0 0 12px;
      }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
      }
      #btn {
        background: #f0b90b;
      }
      #btn:hover {
        background: #d4a409;
      }
      #copyBtn {
        background: #4caf50;
        color: white;
        margin-top: 8px;
      }
      #copyBtn:hover {
        background: #388e3c;
      }
      #curlOutput {
        width: 100%;
        height: 220px;
        font-size: 11px;
        font-family: monospace;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 8px;
        box-sizing: border-box;
        resize: vertical;
        background: #f8f8f8;
        color: #222;
        margin-top: 10px;
      }
      #status {
        margin-top: 10px;
        font-size: 13px;
        color: #333;
        min-height: 18px;
      }
      .success {
        color: green;
      }
      .error {
        color: red;
      }
      .warning-box {
        background: #fff3cd;
        border: 1px solid #f0b90b;
        border-left: 4px solid #e53935;
        border-radius: 4px;
        padding: 8px 10px;
        margin-bottom: 12px;
        font-size: 12px;
        color: #7a4f00;
        line-height: 1.5;
      }
      .warning-box strong {
        color: #c62828;
      }
    </style>
  </head>
  <body>
    <h3>🔑 币安Alpha信息获取</h3>
    <div class="warning-box">
      ⚠️ <strong>安全警告：</strong>此 curl 命令包含您的登录凭证与身份 token，<strong>请勿向任何人泄露</strong>，否则他人可直接操作您的账户，造成不可挽回的财产损失。
    </div>
    <button id="btn">获取curl</button>
    <textarea id="curlOutput" readonly></textarea>
    <button id="copyBtn">复制 curl 命令</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
